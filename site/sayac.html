<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>30-0 Sayaç</title>
<link rel="icon" href="simge-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Oyunun sayacı: kişi, açılış, oyun, sonuçlar, mod ve cihaz. Oyundan bağlantı yok; yalnız kurallarda (firebase-kurallar.json →
     sayac/.read) kimliği yazılı Google hesabı okuyabilir. ?ornek ile Firebase'e bağlanmadan örnek veriyle açılır.
     Her şey seçilen tarih aralığına göre (gun/<gün>/… toplamları). -->
<style>
:root{
  --zemin:#0a1214; --kart:#111d20; --kart2:#0d181b; --yazi:#eef6f7; --soluk:#91a8ac; --sonuk:#5f7478; --cizgi:#1d2e32; --izgara:#16252a;
  --vurgu:#4cc8d0; --vurgu-uzeri:#062126;
  /* koyu zemin için doğrulanmış seri renkleri (açıklık 0,48–0,67, renk körlüğünde ayrışır) */
  --s-kisi:#8f7ae8; --s-acilis:#2fa4ab; --s-oyna:#df7128;
  --baslik:"Barlow Condensed",sans-serif; --govde:Barlow,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--zemin);color:var(--yazi);font:15px/1.4 var(--govde);min-height:100vh}
.sayfa{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:800 26px/1 var(--baslik);letter-spacing:.5px;text-transform:uppercase}
.logo b{color:var(--vurgu)}
.logo small{display:block;font:600 12px var(--govde);color:var(--soluk);letter-spacing:.4px;text-transform:none;margin-top:3px}
.kim{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--soluk);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.dugme{background:var(--vurgu);color:var(--vurgu-uzeri);border:0;border-radius:999px;padding:9px 18px;font:700 15px var(--govde)}
.dugme.ikincil{background:transparent;color:var(--soluk);border:1px solid var(--cizgi);padding:6px 14px;font-size:13px}
.secici{display:inline-flex;background:var(--kart);border:1px solid var(--cizgi);border-radius:999px;padding:3px;margin:22px 0 16px}
.secici button{background:none;border:0;border-radius:999px;padding:6px 14px;color:var(--soluk);font-weight:600;font-size:14px}
.secici button.aktif{background:var(--vurgu);color:var(--vurgu-uzeri)}
.kutucuklar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:14px 16px}
.kutu .ad{font:600 12px var(--govde);color:var(--soluk);letter-spacing:.3px;text-transform:uppercase}
.kutu .sayi{font:800 40px/1.05 var(--baslik);margin-top:6px;font-variant-numeric:tabular-nums}
.kutu .alt{font-size:12px;color:var(--soluk);margin-top:2px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:16px;margin-top:12px}
.kart h2{font:800 22px var(--baslik);letter-spacing:.3px;text-transform:uppercase}
.kart h2 small{font:500 13px var(--govde);color:var(--soluk);text-transform:none;letter-spacing:0;margin-left:8px}
.kart h3{font:800 17px var(--baslik);letter-spacing:.3px;text-transform:uppercase}
.kart h3 small{font:500 12px var(--govde);color:var(--soluk);text-transform:none;letter-spacing:0;margin-left:6px}
.lejant{display:flex;gap:16px;margin:8px 0 4px;font-size:13px;color:var(--soluk);flex-wrap:wrap}
.lejant span{display:inline-flex;align-items:center;gap:6px}
.lejant i{display:inline-block;width:16px;height:2px;border-radius:2px}
.grafik{position:relative;margin-top:6px}
.grafik svg{display:block;width:100%;overflow:visible}
.ipucu{position:absolute;pointer-events:none;background:#06100f;border:1px solid var(--cizgi);border-radius:10px;padding:8px 10px;font-size:13px;min-width:130px;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .1s;z-index:5}
.ipucu .t{color:var(--soluk);font-size:12px;margin-bottom:4px}
.ipucu .s{display:flex;align-items:center;gap:8px}
.ipucu .s i{display:inline-block;width:12px;height:2px;border-radius:2px}
.ipucu .s b{font-variant-numeric:tabular-nums;min-width:28px}
.ipucu .s em{font-style:normal;color:var(--soluk)}
.dortlu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:12px}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px}
.cubuklar{margin-top:8px;display:grid;gap:9px}
.cubuk .ust{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.cubuk .ust span{color:var(--soluk)}
.cubuk .ust b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cubuk .yol{height:10px;background:var(--kart2);border-radius:4px;overflow:hidden}
.cubuk .dolu{height:100%;background:var(--s-oyna);border-radius:0 4px 4px 0}
.cubuk .dolu.acilis{background:var(--s-acilis)}
.ozetler{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:10px}
.ozetler div{font-size:13px;color:var(--soluk)}
.ozetler b{display:block;font:800 28px/1.1 var(--baslik);color:var(--yazi);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
th{font:600 12px var(--govde);color:var(--soluk);text-align:left;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;border-bottom:1px solid var(--cizgi);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--izgara);white-space:nowrap}
.tablo{overflow-x:auto}
td.s,th.s{text-align:right}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details.kart>summary{font:800 22px var(--baslik);text-transform:uppercase;letter-spacing:.3px}
details.ic{margin-top:14px}
details.ic>summary{font:600 13px var(--govde);color:var(--soluk)}
details>summary::before{content:"▸ ";color:var(--soluk)}
details[open]>summary::before{content:"▾ "}
.bos{color:var(--soluk);font-size:14px;padding:6px 0}
.uyari{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:18px;margin-top:22px;line-height:1.55}
.uyari h2{font:800 22px var(--baslik);text-transform:uppercase;margin-bottom:6px}
.uyari code{display:inline-block;background:var(--kart2);border:1px solid var(--cizgi);border-radius:8px;padding:6px 10px;font:600 14px ui-monospace,Consolas,monospace;margin:8px 8px 8px 0;word-break:break-all}
.uyari p+p{margin-top:8px}
.not{color:var(--sonuk);font-size:12px;margin-top:14px;line-height:1.5}
.yukleniyor{opacity:.5;transition:opacity .2s}
@media (max-width:760px){
  .kutucuklar{grid-template-columns:repeat(2,1fr)}
  .dortlu{grid-template-columns:1fr 1fr}
  .ikili{grid-template-columns:1fr}
  .kutu .sayi{font-size:34px}
  td,th{padding:6px 5px}
}
@media (max-width:480px){ .dortlu{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="sayfa">
  <header>
    <div class="logo">Pota Altı <b>30-0</b><small>Sayaç</small></div>
    <div class="kim" id="kim"></div>
  </header>
  <div id="icerik"></div>
</div>
<div class="ipucu" id="ipucu"></div>
<script src="firebase-ayar.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const SURUM = "10.12.2";
  const ORNEK = /[?&]ornek/.test(location.search);
  const RENK = { kisi: "#8f7ae8", acilis: "#2fa4ab", oyna: "#df7128" };
  const MOD_AD = { serbest: "Tek başına", yz: "vs AI", iki: "2 kişi · tek cihaz", oda: "2 kişi · link", gunluk: "Günlük" };
  const TUR_AD = { sezon: "Sezon", lig: "Lig + play-off" };
  const LIG_AD = { bsl: "BSL", tbl: "TBL" };
  const MAC = { bsl: 30, tbl: 32 };
  const BASLANGIC = ORNEK ? "2000-01-01" : "2026-11-20"; // sayacın canlıya çıktığı gün (örnek veride sınır yok)
  const CIHAZ_AD = { tel_tarayici: "Telefon · tarayıcı", tel_uygulama: "Telefon · yüklü uygulama", pc_tarayici: "Bilgisayar · tarayıcı", pc_uygulama: "Bilgisayar · yüklü uygulama" };
  let veri = null, aralik = 30;
  try { aralik = +(localStorage.getItem("p300:sayacAralik") ?? 30); } catch (e) { /* yok */ }

  const bicim = (n) => Math.round(n).toLocaleString("tr-TR");
  const ondalik = (n) => n.toLocaleString("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const yuzde = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "–");
  const gunAnahtar = (d) => d.toLocaleDateString("sv-SE", { timeZone: "Europe/Istanbul" });
  const gunEtiket = (k, uzun) => { const [y, a, g] = k.split("-").map(Number); const d = new Date(Date.UTC(y, a - 1, g, 12));
    return d.toLocaleDateString("tr-TR", uzun ? { day: "numeric", month: "long", weekday: "short", timeZone: "UTC" } : { day: "numeric", month: "short", timeZone: "UTC" }); };
  function el(etiket, ozellik, ...cocuk) {
    const e = document.createElement(etiket);
    Object.entries(ozellik || {}).forEach(([k, v]) => { if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v); });
    cocuk.flat().forEach((c) => e.append(c && c.nodeType ? c : document.createTextNode(c == null ? "" : String(c))));
    return e;
  }
  const ekle = (hedef, kaynak) => Object.entries(kaynak || {}).forEach(([k, v]) => { hedef[k] = (hedef[k] || 0) + v; });

  // ---- aralıktaki günler (veri yoksa 0), bugün dahil ----
  function gunler() {
    const g = (veri && veri.gun) || {}, bugun = gunAnahtar(new Date());
    let bas;
    if (aralik) { const d = new Date(); d.setUTCDate(d.getUTCDate() - (aralik - 1)); bas = gunAnahtar(d); }
    else { // "Hepsi": sayaçtan önceki tarihler (eski deneme kaydı) yok sayılır; çizgi görünsün diye en az 7 gün
      const d7 = new Date(); d7.setUTCDate(d7.getUTCDate() - 6);
      const ilk = Object.keys(g).filter((k) => k >= BASLANGIC).sort()[0] || bugun;
      bas = ilk < gunAnahtar(d7) ? ilk : gunAnahtar(d7);
    }
    const l = [], d = new Date(bas + "T12:00:00Z");
    for (let i = 0; i < 40000; i++) {
      const k = d.toISOString().slice(0, 10); if (k > bugun) break;
      const x = g[k] || {};
      l.push({ k: k, kisi: x.tekil || 0, yeni: x.yeni || 0, acilis: x.acilis || 0, oyna: x.oyna || 0, otuz: x.otuz || 0, sampiyon: x.sampiyon || 0, ham: x });
      d.setUTCDate(d.getUTCDate() + 1);
    }
    return l;
  }
  function topla(l) {
    const t = { yeni: 0, acilis: 0, oyna: 0, otuz: 0, sampiyon: 0, k: {}, s: {}, c: {}, sp: {} };
    l.forEach((x) => { ["yeni", "acilis", "oyna", "otuz", "sampiyon"].forEach((a) => { t[a] += x[a]; }); ekle(t.k, x.ham.k); ekle(t.s, x.ham.s); ekle(t.c, x.ham.c); ekle(t.sp, x.ham.sp); });
    return t;
  }

  // ---- ipucu ----
  const ip = $("ipucu");
  function ipucu(kap, xYerel, baslik, satirlar, olcekX) {
    ip.textContent = "";
    ip.append(el("div", { class: "t" }, baslik));
    satirlar.forEach(([renk, deger, ad]) => ip.append(el("div", { class: "s" }, el("i", { style: "background:" + renk }), el("b", {}, deger), el("em", {}, ad))));
    const r = kap.getBoundingClientRect(); ip.style.opacity = 1;
    let px = r.left + window.scrollX + xYerel * olcekX + 14;
    if (px + ip.offsetWidth > window.scrollX + document.documentElement.clientWidth - 8) px = r.left + window.scrollX + xYerel * olcekX - ip.offsetWidth - 14;
    ip.style.left = px + "px"; ip.style.top = r.top + window.scrollY + 8 + "px";
  }
  const ipucuGizle = () => { ip.style.opacity = 0; };

  function ciz() {
    const ic = $("icerik"); ic.textContent = ""; ic.classList.remove("yukleniyor");
    const sec = el("div", { class: "secici", role: "group", "aria-label": "Tarih aralığı" });
    [[7, "Son 7 gün"], [30, "Son 30 gün"], [90, "Son 90 gün"], [0, "Hepsi"]].forEach(([n, ad]) => {
      const b = el("button", { class: n === aralik ? "aktif" : "" }, ad);
      b.onclick = () => { aralik = n; try { localStorage.setItem("p300:sayacAralik", String(n)); } catch (e) { /* yok */ } ciz(); };
      sec.append(b);
    });
    ic.append(sec);

    const l = gunler(), t = topla(l), bugun = l[l.length - 1] || { kisi: 0, acilis: 0, oyna: 0 };
    const aralikAd = aralik ? "son " + aralik + " gün" : "tüm zamanlar";

    // ---- kutucuklar ----
    const kutu = (ad, sayi, alt) => el("div", { class: "kutu" }, el("div", { class: "ad" }, ad), el("div", { class: "sayi" }, sayi), el("div", { class: "alt" }, alt));
    ic.append(el("div", { class: "kutucuklar" },
      kutu("Yeni kişi", bicim(t.yeni), "ilk kez açan · bugün " + bicim(bugun.kisi) + " kişi"),
      kutu("Açılış", bicim(t.acilis), "bugün " + bicim(bugun.acilis)),
      kutu("Oyun", bicim(t.oyna), (t.acilis ? "açılış başına " + ondalik(t.oyna / t.acilis) + " · " : "") + "bugün " + bicim(bugun.oyna)),
      kutu("30-0", bicim(t.otuz), bicim(t.sampiyon) + " şampiyonluk")));

    // ---- gün gün ----
    const kart = el("div", { class: "kart" }, el("h2", {}, "Gün gün", el("small", {}, aralikAd + " · İstanbul saatiyle")));
    const seriler = [["kisi", RENK.kisi, "Kişi"], ["acilis", RENK.acilis, "Açılış"], ["oyna", RENK.oyna, "Oyun"]];
    kart.append(el("div", { class: "lejant" }, seriler.map(([, r, ad]) => el("span", {}, el("i", { style: "background:" + r }), ad))));
    const kutuG = el("div", { class: "grafik" }); kart.append(kutuG); ic.append(kart);
    cizgiGrafik(kutuG, l, seriler);

    // ---- ne oynanıyor + cihaz ----
    const grup = (kay, f) => { const g = {}; Object.entries(kay).forEach(([k, v]) => { const a = f(k.split("_")); g[a] = (g[a] || 0) + v; }); return g; };
    const liste = (baslik, alt, g, adlar, sinif) => {
      const toplam = Object.values(g).reduce((a, b) => a + b, 0), en = Math.max(1, ...Object.values(g));
      const c = el("div", { class: "cubuklar" });
      Object.keys(adlar).map((a) => [a, g[a] || 0]).filter(([a, v]) => v || a !== "gunluk").sort((x, y) => y[1] - x[1]).forEach(([a, v]) => {
        c.append(el("div", { class: "cubuk" },
          el("div", { class: "ust" }, el("span", {}, adlar[a]), el("b", {}, bicim(v) + " · " + yuzde(v, toplam))),
          el("div", { class: "yol" }, el("div", { class: "dolu" + (sinif ? " " + sinif : ""), style: "width:" + (v / en) * 100 + "%" }))));
      });
      return el("div", {}, el("h3", {}, baslik, alt ? el("small", {}, alt) : ""), c);
    };
    const ne = el("div", { class: "kart" }, el("h2", {}, "Ne, nerede oynanıyor", el("small", {}, aralikAd)));
    ic.append(ne);
    if (!Object.keys(t.k).length && !Object.keys(t.c).length) ne.append(el("div", { class: "bos" }, "Bu aralıkta kayıt yok."));
    else {
      ne.append(el("div", { class: "dortlu" },
        liste("Lig", "oyun", grup(t.k, (p) => p[0]), LIG_AD),
        liste("Mod", "oyun", grup(t.k, (p) => p[1]), MOD_AD),
        liste("Tür", "oyun", grup(t.k, (p) => p[2]), TUR_AD),
        liste("Cihaz", "açılış", t.c, CIHAZ_AD, "acilis")));
      if (Object.keys(t.k).length) {
        const tb = el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Lig"), el("th", {}, "Mod"), el("th", {}, "Tür"), el("th", { class: "s" }, "Oyun"), el("th", { class: "s" }, "Pay"))));
        const gov = el("tbody"), top2 = Object.values(t.k).reduce((a, b) => a + b, 0);
        Object.entries(t.k).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => { const p = k.split("_");
          gov.append(el("tr", {}, el("td", {}, LIG_AD[p[0]] || p[0]), el("td", {}, MOD_AD[p[1]] || p[1]), el("td", {}, TUR_AD[p[2]] || p[2]), el("td", { class: "s" }, bicim(v)), el("td", { class: "s" }, yuzde(v, top2)))); });
        tb.append(gov);
        ne.append(el("details", { class: "ic" }, el("summary", {}, "Tüm birleşimler (lig · mod · tür)"), el("div", { class: "tablo" }, tb)));
      }
    }

    // ---- sonuçlar ----
    const so = el("div", { class: "kart" }, el("h2", {}, "Sonuçlar", el("small", {}, aralikAd + " · oyuncu başına (2 kişide ikisi de)")));
    ic.append(so);
    const hist = { bsl: [], tbl: [] }, ligOyun = { bsl: 0, tbl: 0 }, ort = {};
    Object.keys(hist).forEach((lg) => { for (let i = 0; i <= MAC[lg]; i++) hist[lg].push(0); });
    Object.entries(t.s).forEach(([k, v]) => { const [lg, tur, g] = k.split("_"); if (hist[lg] && +g <= MAC[lg]) hist[lg][+g] += v; if (tur === "lig" && lg in ligOyun) ligOyun[lg] += v; });
    Object.keys(hist).forEach((lg) => { const n = hist[lg].reduce((a, b) => a + b, 0); ort[lg] = n ? hist[lg].reduce((a, b, i) => a + b * i, 0) / n : null; ort[lg + "n"] = n; });
    if (!ort.bsln && !ort.tbln) so.append(el("div", { class: "bos" }, "Bu aralıkta sonuç kaydı yok."));
    else {
      // şampiyonluk: toplam her zaman; lig ayrımı 20 Kasım akşamından beri (sp). Aralıkta ligsiz kayıt varsa lig oranı
      // yanlış çıkacağı için yalnız sayı gösterilir.
      const ligToplam = ligOyun.bsl + ligOyun.tbl, ligsiz = t.sampiyon - (t.sp.bsl || 0) - (t.sp.tbl || 0);
      const ligDetay = ["bsl", "tbl"].map((lg) => LIG_AD[lg] + " " + bicim(t.sp[lg] || 0) + (ligsiz > 0 || !ligOyun[lg] ? "" : " (" + yuzde(t.sp[lg] || 0, ligOyun[lg]) + ")")).join(" · ");
      so.append(el("div", { class: "ozetler" },
        el("div", {}, el("b", {}, bicim(t.otuz)), "30-0 (TBL'de 32-0)"),
        el("div", {}, el("b", {}, bicim(t.sampiyon) + (ligToplam ? " · " + yuzde(t.sampiyon, ligToplam) : "")),
          "şampiyonluk · " + bicim(ligToplam) + " lig + play-off oyunundan", el("br"), ligDetay + (ligsiz > 0 ? " · " + bicim(ligsiz) + " lig bilgisi olmadan" : "")),
        el("div", {}, el("b", {}, ort.bsl == null ? "–" : ondalik(ort.bsl) + " / 30"), "BSL ortalama galibiyet"),
        el("div", {}, el("b", {}, ort.tbl == null ? "–" : ondalik(ort.tbl) + " / 32"), "TBL ortalama galibiyet")));
      if (ligsiz > 0) so.append(el("div", { class: "not", style: "margin-top:6px" }, "Şampiyonluğun hangi ligde geldiği 20 Kasım akşamından beri tutuluyor; o günden önceki kayıtlar aralıkta kaldıkça lig lig oran gösterilmez."));
      const ikili = el("div", { class: "ikili" });
      ["bsl", "tbl"].forEach((lg) => {
        const k = el("div", { class: "grafik" });
        ikili.append(el("div", {}, el("h3", {}, LIG_AD[lg] + " galibiyet dağılımı", el("small", {}, bicim(ort[lg + "n"]) + " sezon")), k));
        setTimeout(() => sutunGrafik(k, hist[lg]), 0);
      });
      so.append(ikili);
    }

    // ---- günlük tablo ----
    const det = el("details", { class: "kart" }, el("summary", {}, "Günlük tablo"));
    const tb = el("table", {}, el("thead", {}, el("tr", {}, ["Gün", "Kişi", "Yeni", "Açılış", "Oyun", "30-0"].map((x, i) => el("th", { class: i ? "s" : "" }, x)))));
    const g = el("tbody");
    l.slice().reverse().forEach((x) => g.append(el("tr", {}, el("td", {}, gunEtiket(x.k, true)),
      [x.kisi, x.yeni, x.acilis, x.oyna, x.otuz].map((v) => el("td", { class: "s" }, bicim(v))))));
    tb.append(g); det.append(el("div", { class: "tablo" }, tb)); ic.append(det);

    const hep = (veri && veri.toplam) || {};
    ic.append(el("div", { class: "not" },
      "Tüm zamanlar: " + bicim(hep.yeni || 0) + " kişi · " + bicim(hep.acilis || 0) + " açılış · " + bicim(hep.oyna || 0) + " oyun · " + bicim(hep.otuz || 0) + " kez 30-0. " +
      "Kişi: o gün oyunu açan farklı tarayıcı (kimlik tutulmaz; aynı kişinin telefonu ve bilgisayarı iki sayılır). Yeni kişi: ilk kez açan. " +
      "Açılış her tarayıcı oturumunda bir kez sayılır; oyun her \"Sezonu oyna\"da bir. Kişi, cihaz, mod ve sonuçlar 20 Kasım 2026 akşamından beri tutuluyor." +
      (ORNEK ? " (Örnek veri.)" : "")));
  }

  // ---- SVG çizgi grafik: tek eksen, çarpı çizgisi + ipucu ----
  const NS = "http://www.w3.org/2000/svg";
  const s = (ad, oz) => { const e = document.createElementNS(NS, ad); Object.entries(oz || {}).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
  function eksen(en) { // 4 civarı düzgün çentik
    const ham = Math.max(4, en) / 4, adim = Math.pow(10, Math.floor(Math.log10(ham))), k = [1, 2, 2.5, 5, 10].find((x) => adim * x >= ham) || 10, a = Math.max(1, adim * k);
    return { a: a, ust: Math.ceil(Math.max(4, en) / a) * a };
  }
  function cizgiGrafik(kap, l, seriler) {
    const W = Math.max(300, kap.clientWidth || 600), H = W < 500 ? 220 : 280, sol = 40, sag = 56, ust = 12, alt = 28;
    const gw = W - sol - sag, gh = H - ust - alt;
    const e = eksen(Math.max(0, ...l.flatMap((x) => seriler.map(([k]) => x[k]))));
    const X = (i) => sol + (l.length > 1 ? (i / (l.length - 1)) * gw : gw / 2), Y = (v) => ust + gh - (v / e.ust) * gh;
    const svg = s("svg", { viewBox: "0 0 " + W + " " + H, height: H, role: "img", "aria-label": "Günlük kişi, açılış ve oyun sayıları" });
    for (let v = 0; v <= e.ust + 1e-9; v += e.a) {
      svg.append(s("line", { x1: sol, x2: sol + gw, y1: Y(v), y2: Y(v), stroke: v === 0 ? "#2b4045" : "#16252a", "stroke-width": 1 }));
      const tx = s("text", { x: sol - 8, y: Y(v) + 4, "text-anchor": "end", fill: "#5f7478", "font-size": 11, "font-family": "Barlow" }); tx.textContent = bicim(v); svg.append(tx);
    }
    const adimX = Math.max(1, Math.ceil(l.length / (W < 500 ? 4 : 6)));
    l.forEach((x, i) => { if (i % adimX && i !== l.length - 1) return; if (i !== l.length - 1 && X(l.length - 1) - X(i) < 70) return;
      const tx = s("text", { x: X(i), y: H - 8, "text-anchor": i === l.length - 1 ? "end" : i === 0 ? "start" : "middle", fill: "#5f7478", "font-size": 11, "font-family": "Barlow" });
      tx.textContent = gunEtiket(x.k); svg.append(tx); });
    seriler.forEach(([k, renk]) => {
      const d = l.map((x, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(x[k]).toFixed(1)).join(" ");
      svg.append(s("path", { d: d, fill: "none", stroke: renk, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      if (l.length < 8) l.forEach((x, i) => svg.append(s("circle", { cx: X(i), cy: Y(x[k]), r: 4, fill: renk, stroke: "#111d20", "stroke-width": 2 }))); // az günde çizgi görünmez: nokta
    });
    // son değerler çizgi sonunda; birbirine 13 pikselden yakınsa aralanır
    const son = l[l.length - 1] || {}, et = seriler.map(([k]) => ({ v: son[k] || 0, y: Y(son[k] || 0) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < et.length; i++) if (et[i].y - et[i - 1].y < 13) et[i].y = et[i - 1].y + 13;
    et.forEach((x) => { const tx = s("text", { x: sol + gw + 8, y: x.y + 4, fill: "#eef6f7", "font-size": 12, "font-weight": 600, "font-family": "Barlow" }); tx.textContent = bicim(x.v); svg.append(tx); });
    const capraz = s("line", { y1: ust, y2: ust + gh, stroke: "#91a8ac", "stroke-width": 1, opacity: 0 });
    const noktalar = seriler.map(([, renk]) => s("circle", { r: 4.5, fill: renk, stroke: "#111d20", "stroke-width": 2, opacity: 0 }));
    svg.append(capraz, ...noktalar);
    const alan = s("rect", { x: sol - 6, y: 0, width: gw + 12, height: H, fill: "transparent", tabindex: 0 });
    svg.append(alan);
    const goster = (i) => {
      i = Math.max(0, Math.min(l.length - 1, i)); const x = l[i];
      capraz.setAttribute("x1", X(i)); capraz.setAttribute("x2", X(i)); capraz.setAttribute("opacity", 0.5);
      noktalar.forEach((n, j) => { n.setAttribute("cx", X(i)); n.setAttribute("cy", Y(x[seriler[j][0]])); n.setAttribute("opacity", 1); });
      ipucu(kap, X(i), gunEtiket(x.k, true), seriler.map(([k, renk, ad]) => [renk, bicim(x[k]), ad]), kap.getBoundingClientRect().width / W);
      alan.dataset.i = i;
    };
    const gizle = () => { ipucuGizle(); capraz.setAttribute("opacity", 0); noktalar.forEach((n) => n.setAttribute("opacity", 0)); };
    const enYakin = (ev) => { const r = svg.getBoundingClientRect(); return Math.round(((((ev.clientX - r.left) * W) / r.width - sol) / gw) * (l.length - 1)); };
    alan.addEventListener("pointermove", (ev) => goster(enYakin(ev)));
    alan.addEventListener("pointerdown", (ev) => goster(enYakin(ev)));
    alan.addEventListener("pointerleave", gizle);
    alan.addEventListener("blur", gizle);
    alan.addEventListener("focus", () => goster(l.length - 1));
    alan.addEventListener("keydown", (ev) => { const i = +(alan.dataset.i || l.length - 1);
      if (ev.key === "ArrowLeft") { goster(i - 1); ev.preventDefault(); } if (ev.key === "ArrowRight") { goster(i + 1); ev.preventDefault(); } });
    kap.append(svg);
  }

  // ---- galibiyet dağılımı: sütun başına sezon sayısı ----
  function sutunGrafik(kap, h) {
    const W = Math.max(260, kap.clientWidth || 400), H = 170, sol = 30, sag = 6, ust = 10, alt = 24;
    const gw = W - sol - sag, gh = H - ust - alt, n = h.length, bant = gw / n, gen = Math.min(24, Math.max(3, bant - 2));
    const e = eksen(Math.max(0, ...h));
    const X = (i) => sol + i * bant + (bant - gen) / 2, Y = (v) => ust + gh - (v / e.ust) * gh;
    const svg = s("svg", { viewBox: "0 0 " + W + " " + H, height: H, role: "img", "aria-label": "Galibiyet sayısına göre sezon dağılımı" });
    for (let v = 0; v <= e.ust + 1e-9; v += e.a) {
      svg.append(s("line", { x1: sol, x2: sol + gw, y1: Y(v), y2: Y(v), stroke: v === 0 ? "#2b4045" : "#16252a", "stroke-width": 1 }));
      const tx = s("text", { x: sol - 6, y: Y(v) + 4, "text-anchor": "end", fill: "#5f7478", "font-size": 10, "font-family": "Barlow" }); tx.textContent = bicim(v); svg.append(tx);
    }
    [0, 10, 20, n - 1].forEach((i) => { const tx = s("text", { x: X(i) + gen / 2, y: H - 6, "text-anchor": "middle", fill: "#5f7478", "font-size": 10, "font-family": "Barlow" }); tx.textContent = i; svg.append(tx); });
    const sutunlar = h.map((v, i) => {
      if (!v) return null;
      const y = Y(v), yuk = Math.max(1, ust + gh - y), r = Math.min(4, gen / 2, yuk);
      const d = "M" + X(i) + " " + (ust + gh) + "V" + (y + r) + "Q" + X(i) + " " + y + " " + (X(i) + r) + " " + y + "H" + (X(i) + gen - r) + "Q" + (X(i) + gen) + " " + y + " " + (X(i) + gen) + " " + (y + r) + "V" + (ust + gh) + "Z";
      const p = s("path", { d: d, fill: RENK.oyna }); svg.append(p); return p;
    });
    const alan = s("rect", { x: sol, y: 0, width: gw, height: H, fill: "transparent" }); svg.append(alan);
    const goster = (ev) => {
      const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor((((ev.clientX - r.left) * W) / r.width - sol) / bant)));
      sutunlar.forEach((p, j) => { if (p) p.setAttribute("fill-opacity", j === i ? 1 : 0.55); });
      ipucu(kap, X(i) + gen / 2, i + "-" + (n - 1 - i) + " biten sezon", [[RENK.oyna, bicim(h[i]), "sezon"]], r.width / W);
    };
    alan.addEventListener("pointermove", goster); alan.addEventListener("pointerdown", goster);
    alan.addEventListener("pointerleave", () => { ipucuGizle(); sutunlar.forEach((p) => p && p.setAttribute("fill-opacity", 1)); });
    kap.append(svg);
  }
  let boyutZaman = 0;
  window.addEventListener("resize", () => { clearTimeout(boyutZaman); boyutZaman = setTimeout(() => { if (veri) ciz(); }, 150); });

  // ---- izin yok: kimliği göster ----
  function izinYok(kullanici) {
    const ic = $("icerik"); ic.textContent = "";
    const kopya = el("button", { class: "dugme ikincil" }, "Kopyala");
    kopya.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(kullanici.uid).then(() => { kopya.textContent = "Kopyalandı"; }); };
    ic.append(el("div", { class: "uyari" }, el("h2", {}, "Bu hesabın okuma izni yok"),
      el("p", {}, "Sayaçları yalnız veritabanı kuralında kimliği yazılı hesap okuyabilir. Bu hesabın kimliği:"),
      el("div", {}, el("code", {}, kullanici.uid), kopya),
      el("p", {}, "Bu kimlik firebase-kurallar.json'da sayac → .read satırına yazılıp kurallar Firebase konsoluna yapıştırılınca sayılar burada görünür.")));
  }
  function girisEkrani() {
    $("kim").textContent = "";
    const ic = $("icerik"); ic.textContent = "";
    const b = el("button", { class: "dugme" }, "Google ile giriş");
    b.onclick = async () => {
      const saglayici = new firebase.auth.GoogleAuthProvider();
      try { await firebase.auth().signInWithPopup(saglayici); }
      catch (e) { if (e && /popup/.test(e.code || "")) firebase.auth().signInWithRedirect(saglayici); else hata(e); }
    };
    ic.append(el("div", { class: "uyari" }, el("h2", {}, "Giriş"), el("p", {}, "Sayaçlar yalnız yetkili hesaba açık."), el("p", {}, b)));
  }
  function hata(e) { $("icerik").append(el("div", { class: "uyari" }, el("h2", {}, "Hata"), el("p", {}, (e && (e.code || e.message)) || String(e)))); }
  function yukle(src) { return new Promise((ok, h) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = () => h(new Error("Yüklenemedi: " + src)); document.head.append(sc); }); }

  function ornekVeri() {
    const gun = {}, d = new Date(); let a = 40;
    const ag = { bsl: 0.7, tbl: 0.3 }, am = { serbest: 0.55, yz: 0.25, iki: 0.08, oda: 0.12 }, at = { sezon: 0.6, lig: 0.4 };
    for (let i = 120; i >= 0; i--) {
      const x = new Date(d); x.setUTCDate(x.getUTCDate() - i); a = Math.max(5, a + (Math.random() - 0.45) * 12);
      const ac = Math.round(a * (x.getUTCDay() % 6 === 0 ? 1.4 : 1)), oy = Math.round(ac * (1.2 + Math.random())), kisi = Math.round(ac * 0.8);
      const k = {}, sn = {}, sp = {}; let otuz = 0, samp = 0;
      Object.keys(ag).forEach((l) => Object.keys(am).forEach((m) => Object.keys(at).forEach((t) => { const v = Math.round(oy * ag[l] * am[m] * at[t]); if (v) k[l + "_" + m + "_" + t] = v; })));
      for (let j = 0; j < oy; j++) { const l = Math.random() < 0.7 ? "bsl" : "tbl", t = Math.random() < 0.6 ? "sezon" : "lig", n = MAC[l];
        const g = Math.max(0, Math.min(n, Math.round(n * (0.62 + (Math.random() + Math.random() + Math.random() - 1.5) * 0.25))));
        sn[l + "_" + t + "_" + g] = (sn[l + "_" + t + "_" + g] || 0) + 1; if (g === n) otuz++; if (t === "lig" && g >= n * 0.75 && Math.random() < 0.5) { samp++; sp[l] = (sp[l] || 0) + 1; } }
      gun[gunAnahtar(x)] = { acilis: ac, oyna: oy, tekil: kisi, yeni: Math.round(kisi * 0.35), otuz: otuz, sampiyon: samp, k: k, s: sn, sp: sp,
        c: { tel_tarayici: Math.round(ac * 0.55), tel_uygulama: Math.round(ac * 0.2), pc_tarayici: Math.round(ac * 0.22), pc_uygulama: Math.round(ac * 0.03) } };
    }
    const toplam = {}; Object.values(gun).forEach((x) => ["acilis", "oyna", "yeni", "otuz", "sampiyon"].forEach((a2) => { toplam[a2] = (toplam[a2] || 0) + x[a2]; }));
    return { toplam: toplam, gun: gun };
  }

  async function basla() {
    if (ORNEK) { veri = ornekVeri(); ciz(); return; }
    const A = window.FIREBASE_AYAR;
    if (!A || !A.apiKey) { hata("firebase-ayar.js boş"); return; }
    $("icerik").append(el("div", { class: "bos", style: "margin-top:22px" }, "Yükleniyor…"));
    const kok = "https://www.gstatic.com/firebasejs/" + SURUM + "/";
    await yukle(kok + "firebase-app-compat.js");
    await Promise.all([yukle(kok + "firebase-auth-compat.js"), yukle(kok + "firebase-database-compat.js")]);
    if (!firebase.apps.length) firebase.initializeApp(A);
    let ref = null;
    firebase.auth().onAuthStateChanged((k) => {
      if (ref) { ref.off(); ref = null; }
      if (!k || k.isAnonymous) { girisEkrani(); return; }
      const cik = el("button", { class: "dugme ikincil" }, "Çıkış"); cik.onclick = () => firebase.auth().signOut();
      $("kim").textContent = ""; $("kim").append(el("span", {}, k.displayName || "Giriş yapıldı"), cik);
      $("icerik").classList.add("yukleniyor");
      ref = firebase.database().ref("sayac");
      ref.on("value", (sn) => { veri = sn.val() || {}; ciz(); }, (e) => { if (e && /permission/i.test(e.code || e.message || "")) izinYok(k); else hata(e); });
    });
  }
  basla().catch(hata);
})();
</script>
</body>
